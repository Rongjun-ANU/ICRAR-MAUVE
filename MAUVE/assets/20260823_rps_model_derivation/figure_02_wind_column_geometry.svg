<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5C646B"/></marker>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2F6690"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252A}.title{font-size:34px;font-weight:700;fill:#16324F}.subtitle{font-size:19px;fill:#5C646B}.boxTitle{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#5C646B}.axis{font-size:17px;fill:#20252A}.label{font-size:18px;font-weight:700}</style>
</defs>
<text class="title" x="70" y="65">Wind-aligned column geometry</text>
<text class="subtitle" x="70" y="98">Finite thickness regularizes exact edge-on incidence, but a complete chord is a coherent-column assumption.</text>
<rect x="70" y="140" width="645" height="615" rx="18" fill="#F7F4EE" stroke="#D8D4CB" stroke-width="2"/>
<text class="boxTitle" x="105" y="185" fill="#2F6690">A. Oblique incidence</text>
<ellipse cx="390" cy="485" rx="245" ry="75" fill="#EAF1F5" stroke="#16324F" stroke-width="4"/>
<ellipse cx="390" cy="485" rx="245" ry="25" fill="none" stroke="#2F6690" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="160.0" y1="650.0" x2="610.0" y2="260.0" stroke="#C76D3A" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<line x1="390.0" y1="485.0" x2="390.0" y2="250.0" stroke="#4A7C59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="525" y="315">wind w_hat</text>
<text class="label" x="410" y="275">disk normal n_hat</text>
<path d="M390,355 A130,130 0 0,1 485,397" fill="none" stroke="#6D597A" stroke-width="4"/>
<text class="label" x="462" y="365">theta</text>
<circle cx="390" cy="485" r="9" fill="#A23E48"/>
<text class="body" x="110" y="690">For |w_z| &gt; 0, each ray has a unique midplane crossing.</text>
<text class="small" x="110" y="722">Thin limit: Sigma_w -> Sigma_g / |cos(theta)|.</text>
<rect x="785" y="140" width="645" height="615" rx="18" fill="#F7F4EE" stroke="#D8D4CB" stroke-width="2"/>
<text class="boxTitle" x="820" y="185" fill="#A23E48">B. Exactly edge-on</text>
<rect x="875" y="410" width="450" height="115" rx="55" fill="#EBF3ED" stroke="#4A7C59" stroke-width="4"/>
<ellipse cx="1100" cy="467" rx="225" ry="57" fill="none" stroke="#4A7C59" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="850.0" y1="345.0" x2="1345.0" y2="345.0" stroke="#C76D3A" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<line x1="850.0" y1="467.0" x2="1345.0" y2="467.0" stroke="#6D597A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="1190" y="325">w_hat lies in disk</text>
<text class="label" x="1010" y="450">full chord</text>
<text class="body" x="830" y="595">Sigma_parallel(y,z) = integral rho(sqrt(x^2+y^2),z) dx</text>
<text class="body" x="830" y="635">Finite if h_g &gt; 0 and the radial disk is finite.</text>
<text class="small" x="830" y="680">The chord crosses multiple radii and may mix opposite circular velocities.</text>
<text class="small" x="830" y="710">It is a ray-space mass column, not automatically one material parcel.</text>
</svg>
